name: Render Video

on:
  workflow_dispatch:
    inputs:
      crf:
        description: 'CRF quality (18-23 recommended, default 21)'
        required: false
        default: '21'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render Remotion Video
        run: |
          mkdir -p out
          npx remotion render PashtoMotionCover out/Hakim_Jan_Faryadi_Master.mp4 --crf=${{ github.event.inputs.crf || 21 }} --concurrency=4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hakim_Jan_Faryadi_Master
          path: out/Hakim_Jan_Faryadi_Master.mp4
          retention-days: 14
